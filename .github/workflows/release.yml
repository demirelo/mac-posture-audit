name: Release

# Validate the exact tag with a read-only token before the publisher receives
# release-write or OIDC permissions. Publish only the tested commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (select this same tag in Run workflow)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BATS_JOBS: 4
  HOMEBREW_NO_ANALYTICS: 1

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate tagged source
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve version tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == refs/tags/* ]]
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          # Treat input as data. Reject branch names, options, path separators,
          # newlines and shell syntax before using it as a Git ref or filename.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            printf 'Invalid version tag: %s\n' "$tag" >&2
            exit 1
          fi
          # Keyless provenance uses the workflow event ref and SHA. A manual
          # run must select the same tag, not run main against another tag.
          if [[ "$GITHUB_REF" != "refs/tags/$tag" ]]; then
            printf 'Run this workflow at the selected version tag.\n' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record tested commit
        id: commit
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" == "$GITHUB_SHA" ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Install test tools
        run: brew install bats-core shellcheck shfmt parallel

      - name: Use Apple command-line Python
        # Use the interpreter shipped with the runner's Xcode/Command Line Tools.
        # Do not replace it with a Homebrew or setup-python installation.
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -c 'import sys; assert sys.version_info >= (3, 9); print(sys.executable)'
          echo /usr/bin >> "$GITHUB_PATH"

      - name: Validate before release
        run: ./scripts/test.sh

  release:
    name: Build, sign, and attach release assets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build release tarball from committed files
        id: build
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          dist="mac-posture-audit-${RELEASE_TAG}"
          asset="${dist}.tar.gz"
          # git archive excludes untracked files and gives reproducible metadata.
          # This job does not execute scripts from the release source.
          git archive --format=tar --prefix="${dist}/" "$SOURCE_SHA" \
            mac-posture-audit.sh README.md LICENSE SECURITY.md CHANGELOG.md \
            docs tools scripts/check-read-only.sh | gzip -n > "$asset"
          shasum -a 256 "$asset" > "${asset}.sha256"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign tarball
        env:
          ASSET: ${{ steps.build.outputs.asset }}
        run: cosign sign-blob --yes --bundle "${ASSET}.sigstore" "$ASSET"

      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.build.outputs.asset }}

      - name: Stage attestation
        env:
          ASSET: ${{ steps.build.outputs.asset }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "${ASSET}.intoto.jsonl"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          set -euo pipefail
          # Verify the existing release still points to the tested commit. gh's
          # tag ref API handles both lightweight and annotated tags below.
          ref_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          ref_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')
          while [[ "$ref_type" == tag ]]; do
            ref_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref_sha}" --jq '.object.type')
            ref_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref_sha}" --jq '.object.sha')
          done
          [[ "$ref_type" == commit && "$ref_sha" == "$SOURCE_SHA" ]]
          # Existing assets are immutable. A rerun must not replace them.
          gh release upload "$RELEASE_TAG" \
            "$ASSET" "${ASSET}.sha256" "${ASSET}.sigstore" "${ASSET}.intoto.jsonl"
