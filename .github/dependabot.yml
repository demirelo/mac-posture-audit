# Keep action SHAs, the fuzzing container digest, and hashed Python fuzzing
# dependencies current. The audit and report renderer need no runtime packages.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Keep related action steps, including CodeQL init/analyze, in one PR.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/.clusterfuzzlite"
    # The pinned OSS-Fuzz image runs Python 3.11. Atheris 3.1 publishes
    # wheels only for Python 3.12+ and no source distribution. Revisit this
    # bound when the build image moves to a supported Python version.
    ignore:
      - dependency-name: "atheris"
        versions: [">=3.1.0"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
